[workspace]
resolver = "2"
members = ["crates/kq8-data", "crates/kq8-core", "crates/kq8-cli", "crates/kq8-viewer", "crates/kq8-audio"]
# Plain `cargo run` / `cargo test` use these, so `cargo run -- vol-verify`
# keeps working. The viewer is built with `-p kq8-viewer`.
default-members = ["crates/kq8-data", "crates/kq8-core", "crates/kq8-cli", "crates/kq8-audio"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
kq8-data = { path = "crates/kq8-data" }
kq8-core = { path = "crates/kq8-core" }
kq8-audio = { path = "crates/kq8-audio" }
explode = "0.1.2"
png = "0.18.1"
# The sound card (M3 3h-2, chosen by the user): our own mixer feeds it.
cpal = "0.18.2"
# Only the 3D parts; no audio.
# The viewer's command console: single keys and the terminal's layout.
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows"] }
# The memory allocator (chosen by the user 2026-10-22 from the measured
# tour of all worlds: the Windows one slowed reading 3.5 -> 14.6 s).
mimalloc = { version = "0.1.52", features = ["extended"] }
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
bevy = { version = "0.20.0", default-features = false, features = ["3d", "bevy_ui", "bevy_ui_render"] }

# Decompressing 133 MB byte-by-byte is slow in debug builds; optimise
# dependencies even in dev builds so `cargo run` stays fast.
[profile.dev.package."*"]
opt-level = 3
# No debugging information for dependencies (Bevy's alone made each
# viewer `.pdb` about 1.2 GB); our own crates keep theirs.
debug = false
